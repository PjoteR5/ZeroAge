name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Automated Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated cryptographic & security test suite
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'sqlite:///./zeroage_ci.db' }}
        run: pytest -v

      - name: Verify terminal MVP showcase (demo-all)
        run: python cli.py demo-all


      - name: Verify terminal MVP showcase (demo-all)
        run: python cli.py demo-all