name: Rust ZKP CI

on:
  push:
    branches: [main, Development, RustRebranding]
  pull_request:
    branches: [main, Development, RustRebranding]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo Test & MSO Demo (Rust Stable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Run all workspace unit and integration tests
        run: cargo test --workspace --verbose

      - name: Run end-to-end ISO 18013-5 MDOC + Protocol 2.5 showcase
        run: cargo run -p mdoc-app --example demo_mdoc_flow
